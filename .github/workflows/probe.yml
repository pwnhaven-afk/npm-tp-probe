name: npm trusted-publishing ref probe
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe npm token-exchange encodings + error taxonomy (no publish)
        run: |
          set -u
          echo "event_name=$GITHUB_EVENT_NAME ref=$GITHUB_REF"
          URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org"
          curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$URL" -o idtoken.json
          JWT=$(jq -r .value idtoken.json)
          echo "jwt_len=${#JWT}"
          probe () {
            echo "--- $1"
            curl -sS -o out.json -w "HTTP %{http_code}  " -X POST \
              -H "Authorization: Bearer $JWT" -H "Accept: application/json" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$1"
            head -c 300 out.json; echo
          }
          probe "%40solana%2Fkit"
          probe "@solana%2Fkit"
          probe "%40solana%2fkit"
          probe "@solana%2Fkit%2F"
          echo "=== control: packages likely not using trusted publishing ==="
          probe "left-pad"
          probe "lodash"
          echo "=== control: other known trusted-publishing candidates ==="
          probe "%40sveltejs%2Fkit"
          probe "vite"
